<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afiliaciones</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f9;--card:#fff;--tx:#141a2a;--mut:#6a7388;--bd:#e3e6ee;--ac:#2540d9;--acx:#fff;--side:#0f1729;--sura:#0b3fa8;--comf:#e61c72;--ok:#15803d;--wn:#b45309;--er:#b91c1c;--inf:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#131a2e;--tx:#e8ecf7;--mut:#94a0bb;--bd:#252f49;--ac:#7c93ff;--acx:#0b1020;--side:#080c18;--sura:#5b8def;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--inf:#7aa2ff}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#131a2e;--tx:#e8ecf7;--mut:#94a0bb;--bd:#252f49;--ac:#7c93ff;--acx:#0b1020;--side:#080c18;--sura:#5b8def;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--inf:#7aa2ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:#c9d1e6;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;gap:10px;align-items:center}.brand i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--sura),var(--comf))}
.brand b{display:block;color:#fff;line-height:1.2}.brand small{font-size:12px;opacity:.7}
nav{display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
.main{padding:22px;max-width:1000px;width:100%}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px}nav{flex-direction:row;overflow-x:auto}.main{padding:14px}}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center}.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.note{border:1px solid var(--wn);color:var(--wn);border-radius:10px;padding:6px 12px;font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px 12px;font-size:13px}.chip b{margin-right:5px}
.row{display:grid;grid-template-columns:40px minmax(140px,1.3fr) minmax(110px,.9fr) minmax(230px,1.7fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
@media (max-width:760px){.row{grid-template-columns:40px 1fr}.row>*:nth-child(n+3){grid-column:2}}
.av{width:40px;height:40px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:600;font-size:13px}
.ents{display:flex;gap:6px;flex-wrap:wrap}.ent{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:3px 9px;font-size:12px}
.ent.sura{border-left:3px solid var(--sura)}.ent.comf{border-left:3px solid var(--comf)}.st{font-style:normal;font-weight:600}
.steps{display:flex;margin:12px 0 4px}.steps div{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:18px}
.steps div:before{content:"";position:absolute;top:2px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bd)}.steps div.d{color:var(--tx)}.steps div.d:before{background:var(--ok)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:14px}.g2 .card{margin:0}
.ecard{border-top:4px solid var(--sura)}.ecard.comf{border-top-color:var(--comf)}.eh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.eh b{font-size:16px}.eh .bd{margin-left:auto}
label{display:block;font-size:12px;color:var(--mut)}button{font:inherit}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.b.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
td input,td select{min-width:110px}.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.mut{color:var(--mut);font-size:13px}.bd{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.Afiliado{color:var(--ok)}.Devuelta{color:var(--er)}.Enviada{color:var(--inf)}.Pendiente{color:var(--wn)}.al{color:var(--er);font-weight:600}
.ok{color:var(--ok)}.no{color:var(--er)}#toast{min-height:20px;color:var(--er);font-size:13px}ul{margin:6px 0;padding-left:20px}

<div class="main"><div class="note">Los datos se guardan en el servidor. Usa datos ficticios hasta contar con la autorización de tratamiento de datos.</div><div id="toast"></div><div id="main"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COP=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const KEY="afiliaciones-demo",RISK=["I – Mínimo","II – Bajo","III – Medio","IV – Alto","V – Máximo"],DOCS=["CC","CE","TI","RC","PPT","PA"],PAR=["Cónyuge o compañero(a)","Hijo(a)","Otro"];
const REQ=[["tipo","Tipo de documento"],["num","Número de documento"],["nombres","Nombres"],["apellidos","Apellidos"],["nac","Fecha de nacimiento"],["sexo","Sexo"],["dir","Dirección"],["tel","Teléfono"],["mail","Correo"],["cargo","Cargo"],["sal","Salario"],["ing","Fecha de ingreso"],["contrato","Tipo de contrato"],["riesgo","Clase de riesgo"],["centro","Centro de trabajo"],["eps","EPS"],["afp","Fondo de pensión"],["ced","Copia de la cédula"]];
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const blank=()=>({tipo:"CC",num:"",nombres:"",apellidos:"",nac:"",sexo:"",dir:"",tel:"",mail:"",cargo:"",sal:"",ing:"",contrato:"Indefinido",riesgo:"",centro:"",eps:"",afp:"",ben:[],ced:"",arl:"Pendiente",caja:"Pendiente",motivo:"",log:[]});
let S={a:[]};
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort(([p],[q])=>p<q?-1:1)):x);
const api=async(u,m="GET",b)=>{const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
let SNAP={},busy=0;
const snap=()=>{SNAP={};S.a.forEach(p=>SNAP[p.id]=canon(p))};
const typing=()=>/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
async function cargar(){if(busy)return;try{const d=await api("/api/afiliaciones");if(canon(d)===canon(S.a))return;S.a=d;snap();if(tab!="form"&&!typing())draw()}catch(e){tst("No se pudo conectar con el servidor.")}}
function save(){busy++;const ids=new Set(S.a.map(p=>String(p.id))),jobs=[];S.a.forEach(p=>{if(SNAP[p.id]!==canon(p))jobs.push(api("/api/afiliaciones/"+p.id,"PUT",p))});Object.keys(SNAP).forEach(i=>{if(!ids.has(i))jobs.push(api("/api/afiliaciones/"+i,"DELETE"))});snap();Promise.all(jobs).catch(()=>tst("No se pudo guardar en el servidor.")).finally(()=>busy--)}
const tst=s=>{$("#toast").textContent=s;setTimeout(()=>$("#toast").textContent="",3500)};
const opt=(a,sel)=>a.map(x=>`<option ${x==sel?"selected":""}>${esc(x)}</option>`).join("");
const fld=(l,h)=>`<div><label>${l}</label>${h}</div>`;
const L=(p,m)=>p.log.push(new Date().toLocaleString("es-CO")+" · "+m);
function faltan(p){const m=REQ.filter(([k])=>!p[k]).map(x=>x[1]);if(p.ben.some(b=>!b.n||!b.d||!b.f))m.push("Datos del beneficiario");return m}
function errores(p){const e=[];if(p.num&&!/^\d{5,12}$/.test(p.num))e.push("El número de documento debe tener solo dígitos (5 a 12).");
if(p.mail&&!/^\S+@\S+\.\S+$/.test(p.mail))e.push("El correo no es válido.");if(p.tel&&!/^\d{7,10}$/.test(p.tel))e.push("El teléfono debe tener entre 7 y 10 dígitos.");
if(p.sal!==""&&!(+p.sal>0))e.push("El salario debe ser mayor que cero.");if(p.nac&&p.nac>day(0))e.push("La fecha de nacimiento no puede ser futura.");
if(!p.nombres&&!p.apellidos&&!p.num)e.push("Escribe al menos el nombre o el documento.");return e}
function est(p){if(faltan(p).length)return"Por completar";if(p.arl=="Afiliado"&&p.caja=="Afiliado")return"Afiliada";if(p.arl=="Devuelta"||p.caja=="Devuelta")return"Devuelta";if(p.arl=="Pendiente"&&p.caja=="Pendiente")return"Validada";return"En trámite"}
function alerta(p){if(est(p)=="Afiliada"||!p.ing)return"";const d=Math.round((new Date(p.ing+"T00:00:00")-new Date(day(0)+"T00:00:00"))/864e5);return d<0?"Atrasada":d<=2?"Urgente":""}
let tab="lista",F=blank(),EID=null,OPEN=null;
const go=t=>{tab=t;draw()},ver=id=>{OPEN=id;tab="det";draw()};
function nuevo(){F=blank();EID=null;go("form")}
function editar(id){F=JSON.parse(JSON.stringify(S.a.find(x=>x.id==id)));EID=id;go("form")}
function guardar(){const e=errores(F);if(e.length)return tst(e[0]);F.num=F.num.trim();let id=EID;
if(EID){L(F,"Datos actualizados");S.a=S.a.map(x=>x.id==EID?{...F,id:EID}:x)}else{id=Date.now();L(F,"Registrada");S.a.unshift({...F,id})}
save();ver(id);tst("")}
function setE(id,ent,v){const p=S.a.find(x=>x.id==id);p[ent]=v;L(p,(ent=="arl"?"ARL Sura":"Comfama")+": "+v);save();draw()}
function setM(id,v){S.a.find(x=>x.id==id).motivo=v;save()}
function borrar(id){if(!confirm("¿Eliminar esta afiliación?"))return;S.a=S.a.filter(x=>x.id!=id);save();go("lista")}
function texto(p,ent){const l=[["Documento",p.tipo+" "+p.num],["Nombres",p.nombres],["Apellidos",p.apellidos],["Fecha de nacimiento",p.nac],["Sexo",p.sexo],["Dirección",p.dir],["Teléfono",p.tel],["Correo",p.mail],["Cargo",p.cargo],["Salario",p.sal],["Fecha de ingreso",p.ing],["Tipo de contrato",p.contrato],["Centro de trabajo",p.centro]];
if(ent=="arl")l.push(["Clase de riesgo",p.riesgo],["EPS",p.eps],["Fondo de pensión",p.afp]);else p.ben.forEach((b,i)=>l.push(["Beneficiario "+(i+1),`${b.n} · ${b.t} ${b.d} · ${b.f} · ${b.p}`]));
return l.map(x=>x[0]+": "+x[1]).join("\n")}
function copiar(id,ent){const t=texto(S.a.find(x=>x.id==id),ent);const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();$("#toast").style.color="var(--ok)";tst(ok?"Datos copiados.":"No se pudo copiar; selecciona el texto manualmente.");setTimeout(()=>$("#toast").style.color="",3600)}
function draw(){const n=tab=="form"?1:0;$("#nav").innerHTML=`<button class="${n?"":"on"}" onclick="go('lista')">Panel</button><button class="${n?"on":""}" onclick="nuevo()">Nueva afiliación</button>`;$("#main").innerHTML=V[tab]()}
const SURA=()=>`<span class="ico sura" role="img" aria-label="ARL Sura"></span>`,COMF=()=>`<span class="ico comf" role="img" aria-label="Comfama"></span>`;
const V={
lista(){const c=e=>S.a.filter(p=>est(p)==e).length,ini=p=>((p.nombres[0]||"")+(p.apellidos[0]||"")).toUpperCase()||"?",
ent=(p,k)=>`<span class="ent ${k=="arl"?"sura":"comf"}">${k=="arl"?SURA()+" ARL Sura":COMF()}<em class="st ${p[k]}">${p[k]}</em></span>`;
return `<h1>Panel de afiliaciones</h1><p class="sub">Estado de cada trabajador ante ARL Sura y Comfama.</p>
<div class="chips">${["Por completar","Validada","En trámite","Devuelta","Afiliada"].map(e=>`<span class="chip"><b>${c(e)}</b>${e}</span>`).join("")}</div>
${S.a.map(p=>`<article class="row"><div class="av">${esc(ini(p))}</div><div><b>${esc(p.nombres+" "+p.apellidos)}</b><div class="mut">${p.tipo} ${esc(p.num)}${p.cargo?" · "+esc(p.cargo):""}</div></div><div><div class="mut">Ingreso</div>${p.ing||"—"} <span class="al">${alerta(p)}</span></div><div class="ents">${ent(p,"arl")}${ent(p,"caja")}</div><div><b>${est(p)}</b> <button class="b" onclick="ver(${p.id})">Abrir</button></div></article>`).join("")||`<div class="card mut">Sin afiliaciones todavía.</div>`}`},
form(){const f=(k,l,t="text")=>fld(l,`<input type="${t}" value="${esc(F[k])}" oninput="F.${k}=this.value">`),s=(k,l,o)=>fld(l,`<select onchange="F.${k}=this.value"><option value="">Selecciona…</option>${opt(o,F[k])}</select>`);
return `<div class="card"><h2>${EID?"Editar afiliación":"Nueva afiliación"} · Trabajador</h2><div class="g">${s("tipo","Tipo de documento",DOCS)}${f("num","Número de documento")}${f("nombres","Nombres")}${f("apellidos","Apellidos")}${f("nac","Fecha de nacimiento","date")}${s("sexo","Sexo",["Femenino","Masculino"])}${f("dir","Dirección")}${f("tel","Teléfono","tel")}${f("mail","Correo","email")}</div></div>
<div class="card"><h2>Datos laborales y de ${SURA()} ARL Sura</h2><div class="g">${f("cargo","Cargo")}${f("sal","Salario mensual","number")}${f("ing","Fecha de ingreso","date")}${s("contrato","Tipo de contrato",["Indefinido","Fijo","Obra o labor","Aprendizaje"])}${s("riesgo","Clase de riesgo",RISK)}${f("centro","Centro de trabajo")}${f("eps","EPS")}${f("afp","Fondo de pensión")}</div></div>
<div class="card"><h2>${COMF()} Beneficiarios para Comfama (opcional)</h2><div class="sc"><table><tr><th>Nombre</th><th>Tipo doc.</th><th>Documento</th><th>Nacimiento</th><th>Parentesco</th><th></th></tr>
${F.ben.map((b,i)=>`<tr><td><input value="${esc(b.n)}" oninput="F.ben[${i}].n=this.value"></td><td><select onchange="F.ben[${i}].t=this.value">${opt(DOCS,b.t)}</select></td><td><input value="${esc(b.d)}" oninput="F.ben[${i}].d=this.value"></td><td><input type="date" value="${b.f}" oninput="F.ben[${i}].f=this.value"></td><td><select onchange="F.ben[${i}].p=this.value">${opt(PAR,b.p)}</select></td><td><button class="b" onclick="F.ben.splice(${i},1);draw()">Quitar</button></td></tr>`).join("")}</table></div>
<p><button class="b" onclick="F.ben.push({n:'',t:'TI',d:'',f:'',p:'Hijo(a)'});draw()">Agregar beneficiario</button></p></div>
<div class="card"><h2>Soportes</h2>${fld("Copia de la cédula (imagen o PDF)",`<input type="file" accept="image/*,.pdf" onchange="F.ced=this.files[0]?this.files[0].name:''">`)}<p class="mut">Archivo actual: ${esc(F.ced||"ninguno")}. En este prototipo solo se guarda el nombre; en producción iría cifrado en un servidor.</p>
<p><button class="b p" onclick="guardar()">Guardar afiliación</button> <button class="b" onclick="go('lista')">Cancelar</button></p></div>`},
det(){const p=S.a.find(x=>x.id==OPEN);if(!p)return V.lista();const has=ks=>ks.every(k=>p[k]),al=alerta(p),it=(l,ok,t)=>`<li class="${ok?"ok":"no"}">${ok?"✔":"✘"} ${l}${t?` <span class="mut">${esc(t)}</span>`:""}</li>`,
base=has(["tipo","num","nombres","apellidos","nac","sexo","dir","tel","mail"]),dn=[1,!faltan(p).length,p.arl=="Afiliado",p.caja=="Afiliado",est(p)=="Afiliada"],
ec=(k,cls,head,list)=>`<section class="card ecard ${cls}"><div class="eh">${head}<span class="bd ${p[k]}">${p[k]}</span></div><ul>${list}${it("Copia de la cédula",has(["ced"]),p.ced)}</ul><p><button class="b" onclick="copiar(${p.id},'${k}')">Copiar datos para el portal</button></p>${fld("Estado del trámite",`<select onchange="setE(${p.id},'${k}',this.value)">${opt(["Pendiente","Enviada","Afiliado","Devuelta"],p[k])}</select>`)}</section>`;
return `<p><button class="b" onclick="go('lista')">← Volver</button> <button class="b" onclick="editar(${p.id})">Editar datos</button> <button class="b" onclick="borrar(${p.id})">Eliminar</button></p>
<div class="card"><h1>${esc(p.nombres+" "+p.apellidos)}</h1><div class="mut">${p.tipo} ${esc(p.num)} · Ingreso ${p.ing||"—"}${p.cargo?" · "+esc(p.cargo)+" · "+COP(p.sal):""} ${al?`<span class="al">${al}</span>`:""}</div>
<div class="steps">${["Registrada","Datos completos","ARL Sura","Comfama","Afiliada"].map((s,i)=>`<div class="${dn[i]?"d":""}">${s}</div>`).join("")}</div>${faltan(p).length?`<p class="no">Falta: ${faltan(p).map(esc).join(", ")}.</p>`:""}</div>
<div class="g2">${ec("arl","",`${SURA()}<b>ARL Sura</b>`,it("Datos del trabajador",base)+it("Datos laborales",has(["cargo","sal","ing","contrato","centro"]))+it("Clase de riesgo",has(["riesgo"]))+it("EPS y fondo de pensión",has(["eps","afp"])))}${ec("caja","comf",`${COMF()}<b>Comfama</b>`,it("Datos del trabajador",base)+it("Salario y fecha de ingreso",has(["sal","ing","contrato"]))+it("Beneficiarios",true,p.ben.length?p.ben.length+" registrado(s)":"sin beneficiarios"))}</div>
<div class="card"><h2>Motivo de devolución (si aplica)</h2><textarea rows="2" onchange="setM(${p.id},this.value)">${esc(p.motivo)}</textarea></div>
<div class="card"><h2>Bitácora</h2>${p.log.slice().reverse().map(l=>`<div class="mut">${esc(l)}</div>`).join("")}</div>`}};
draw();cargar();setInterval(cargar,5000);
</script></body></html>
